name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping a superseded build: $TESTED_SHA"
          fi
      - uses: actions/download-artifact@v8
        if: steps.current.outputs.deploy == 'true'
        with:
          name: lumina-site
          path: site
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/upload-pages-artifact@v5
        if: steps.current.outputs.deploy == 'true'
        with:
          path: site
      - name: Deploy tested files to GitHub Pages
        id: deployment
        if: steps.current.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
