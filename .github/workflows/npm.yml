name: npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, matching package.json (for example v0.14.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # npm Trusted Publishing uses short-lived OIDC credentials. Do not
          # cache package-manager metadata in this credentialed release job.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Match release tag to package version
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build:all
      - run: npm run check:sdk
      - name: Attach the verified install package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.tgz artifacts/*.sha256 --clobber
      - name: Publish to npm with provenance
        env:
          # Prefer npm Trusted Publishing (OIDC). A granular token is optional.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish artifacts/*.tgz --access public --provenance
