name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - name: Use accepted candidate source time when configured
        env:
          CANDIDATE_SOURCE_EPOCH: ${{ vars.RELEASE_SOURCE_DATE_EPOCH }}
        run: |
          if [ -n "$CANDIDATE_SOURCE_EPOCH" ]; then
            node --input-type=module -e 'import { sourceTimestamp } from "./scripts/build-time.mjs"; sourceTimestamp(process.env.CANDIDATE_SOURCE_EPOCH);'
            echo "SOURCE_DATE_EPOCH=$CANDIDATE_SOURCE_EPOCH" >> "$GITHUB_ENV"
          fi
      - run: npm run build:site
      - run: npm run check:api
      - run: npm run check:sdk
      - run: node scripts/check-bundle-performance.mjs
      - run: node scripts/check-xlsx-corpus.mjs
      - run: node scripts/check-wps-corpus.mjs
      - run: node scripts/check-xlsx-corpus-evidence.mjs docs/acceptance/browser-candidate-2026-09-24-r14/xlsx-corpus.json
      - run: npm run check:browser-evidence -- docs/acceptance/browser-candidate-2026-09-24-r14 --verify-build --require-accessibility --require-ime --require-persistence
      - name: Generate dependency-license inventory
        run: node scripts/package-notices.mjs
      - name: Require complete dependency-license evidence
        run: npm run check:licenses -- --strict
      - name: Block dependency integrity errors
        working-directory: .
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const inventory = JSON.parse(await readFile("dist/sdk/dependency-inventory.json", "utf8"));
            if (inventory.summary.errors) {
              console.error(JSON.stringify(inventory.issues.filter((item) => item.severity === "error"), null, 2));
              process.exit(1);
            }
            console.log(`License review items remain visible: ${inventory.summary.reviewItems}; stable release keeps the strict gate.`);
          '
      - name: Verify reproducible site and package build
        run: npm run check:reproducibility
      - name: Smoke-test the final Pages build over HTTP
        run: npm run check:site-runtime
      - name: Record tested build
        run: node scripts/build-info.mjs
      - name: Require accepted site and package for stable 1.x and later
        run: node scripts/check-stable-release.mjs --site
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: |
            artifacts/*.tgz
            artifacts/*.sha256
            artifacts/reproducibility/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        # Also needed by browser acceptance on pull requests; CD still deploys main only.
        with:
          name: lumina-site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  frameworks:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/fixtures/frameworks/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: lumina-site
          path: dist
      - name: Install pinned browser acceptance tools
        run: npm ci --ignore-scripts --prefix scripts/fixtures/frameworks
      - name: Install Chromium, Firefox and WebKit
        run: node scripts/fixtures/frameworks/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Verify installed SDK in React and Vue development and production hosts
        run: node scripts/browser-frameworks.mjs
      - name: Verify real recovery downloads, imports and persistent copies
        run: node scripts/check-recovery-browser.mjs
      - name: Verify recovery evidence and screenshots
        run: node scripts/check-recovery-evidence.mjs artifacts/browser-recovery
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: framework-browser-reports
          path: |
            artifacts/browser-frameworks/
            artifacts/browser-recovery/
          if-no-files-found: error
          retention-days: 14
