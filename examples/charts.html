<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumina 图表分析</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f7f6;
        color: #263c30;
        font:
          14px system-ui,
          sans-serif;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 28px 20px;
      }
      h1 {
        font-size: 28px;
      }
      p {
        line-height: 1.7;
        color: #54675a;
      }
      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
        margin: 22px 0;
      }
      button,
      select,
      input {
        font: inherit;
        padding: 10px;
        border: 1px solid #98a99e;
        border-radius: 6px;
        background: white;
        color: inherit;
      }
      button {
        cursor: pointer;
        min-height: 44px;
      }
      input {
        width: 110px;
      }
      :focus-visible {
        outline: 3px solid #315fa0;
        outline-offset: 3px;
      }
      #plot {
        background: white;
        border: 1px solid #d1dcd5;
        border-radius: 8px;
        padding: 8px;
      }
      #plot svg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .data {
        overflow: auto;
        margin-top: 20px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        background: white;
      }
      caption {
        text-align: left;
        font-weight: 650;
        padding: 12px 0;
      }
      th,
      td {
        text-align: right;
        padding: 12px;
        border-bottom: 1px solid #dce3de;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      #status {
        min-height: 22px;
      }
      #status[data-error='true'] {
        color: #a12c22;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="./report.html">← 表格与报表示例</a>
      <h1>销售趋势与区域对比</h1>
      <p>用相同的数据切换趋势、比较和占比视图。修改华东营收后，图表与数据表一同更新。</p>
      <div class="controls">
        <label
          >图表类型
          <select id="type">
            <option value="bar">柱状图</option>
            <option value="line">折线图</option>
            <option value="pie">饼图</option>
          </select></label
        >
        <label
          >数据来源
          <select id="source">
            <option value="records">明细汇总</option>
            <option value="pivot">透视结果</option>
          </select></label
        >
        <label>华东营收 <input id="amount" type="number" value="120" step="1" /></label>
        <button id="apply">更新数据</button><button id="export">导出 SVG</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="plot"></div>
      <div class="data">
        <table>
          <caption>
            图表精确数据（单位：万元）
          </caption>
          <thead id="head"></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p>
        此处使用合成销售数据；缺失值不当作零。饼图只呈现营收。图表为独立
        SVG，可下载为矢量图片，尚不支持 Excel 原生图表往返。
      </p>
    </main>
    <script type="module">
      import {
        createChartModel,
        createPivot,
        createPivotChartModel,
        chartToSvg,
      } from '../src/sdk/index.tsx';
      const byId = (id) => document.getElementById(id);
      const records = [
        { region: '华东', revenue: 120, cost: 80 },
        { region: '华南', revenue: 160, cost: 100 },
        { region: '华北', revenue: 90, cost: 60 },
        { region: '西部', revenue: 70, cost: null },
      ];
      let model;
      function render() {
        try {
          const type = byId('type').value;
          const values = [
            { field: 'revenue', title: '营收', aggregate: 'sum' },
            ...(type === 'pie' ? [] : [{ field: 'cost', title: '成本', aggregate: 'sum' }]),
          ];
          const next =
            byId('source').value === 'pivot'
              ? createPivotChartModel(createPivot({ rows: ['region'], values }, records), {
                  type,
                  title: '区域销售分析',
                })
              : createChartModel(
                  { type, category: 'region', series: values, title: '区域销售分析' },
                  records,
                );
          const svg = chartToSvg(next);
          byId('plot').innerHTML = svg;
          const heading = document.createElement('tr');
          for (const label of ['区域', ...next.series.map((s) => s.title)]) {
            const th = document.createElement('th');
            th.scope = 'col';
            th.textContent = label;
            heading.append(th);
          }
          byId('head').replaceChildren(heading);
          const rows = next.categories.map((category, index) => {
            const tr = document.createElement('tr');
            const th = document.createElement('th');
            th.scope = 'row';
            th.textContent = category;
            tr.append(th);
            for (const series of next.series) {
              const td = document.createElement('td');
              td.textContent =
                series.values[index] === null ? '缺失' : String(series.values[index]);
              tr.append(td);
            }
            return tr;
          });
          byId('rows').replaceChildren(...rows);
          model = next;
          byId('status').textContent = '图表与数据表已更新';
          byId('status').dataset.error = 'false';
        } catch (error) {
          byId('status').textContent = error.message;
          byId('status').dataset.error = 'true';
        }
      }
      byId('type').addEventListener('change', render);
      byId('source').addEventListener('change', render);
      byId('apply').addEventListener('click', () => {
        const raw = byId('amount').value;
        if (!raw.trim() || !Number.isFinite(Number(raw))) {
          byId('status').textContent = '请输入有限的营收数字';
          byId('status').dataset.error = 'true';
          return;
        }
        const previous = records[0].revenue;
        records[0].revenue = Number(raw);
        render();
        if (byId('status').dataset.error === 'true') records[0].revenue = previous;
      });
      byId('export').addEventListener('click', () => {
        const url = URL.createObjectURL(
          new Blob([chartToSvg(model)], { type: 'image/svg+xml;charset=utf-8' }),
        );
        const link = document.createElement('a');
        link.href = url;
        link.download = 'lumina-chart.svg';
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      render();
    </script>
  </body>
</html>
